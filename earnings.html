<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sponsor Earnings</title>
<style>
  :root { --bg:#0e0f12; --card:#16181d; --line:#262a31; --ink:#eef0f3; --mute:#8b919c; --go:#3ccf8e; --wait:#f2b84b; --acc:#7c8cff; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --card:#fff; --line:#e4e7ec; --ink:#14161a; --mute:#646b76; --go:#14915a; --wait:#a86b00; --acc:#4a5bd8; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
  .k { color: var(--mute); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 4px 0 22px; font-size: 26px; letter-spacing: -.01em; }
  .tiles { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-bottom: 26px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .tile b { display:block; font-size: 22px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile.go b { color: var(--go); } .tile.wait b { color: var(--wait); }
  .tabs { display:flex; gap:6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button { background:transparent; color:var(--mute); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .tabs button.on { color:var(--ink); border-color: var(--acc); }
  h2 { font-size: 13px; color: var(--mute); font-weight: 600; margin: 22px 0 8px; display:flex; justify-content: space-between; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px; display:grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .t { font-weight: 600; overflow-wrap: anywhere; }
  .amt { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .sub { color: var(--mute); font-size: 13px; }
  .chip { font-size: 12px; border-radius: 999px; padding: 2px 9px; justify-self: end; white-space: nowrap; }
  .chip.paid { background: color-mix(in srgb, var(--go) 16%, transparent); color: var(--go); }
  .chip.due { background: color-mix(in srgb, var(--wait) 16%, transparent); color: var(--wait); }
  .chip.up { background: color-mix(in srgb, var(--acc) 16%, transparent); color: var(--acc); }
  .row { cursor: pointer; }
  .row.open { border-color: var(--acc); cursor: default; }
  .ed { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  .ed label { display: grid; gap: 4px; font-size: 12px; color: var(--mute); }
  .ed input[type=text], .ed input[type=date] { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; width: 100%; }
  .ed .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); align-self: end; padding-bottom: 8px; }
  .ed .chk input { width: 18px; height: 18px; accent-color: var(--go); }
  .ed .acts { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
  .btn { background: var(--acc); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--mute); border: 1px solid var(--line); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .err { color: #ff6b6b; font-size: 13px; }
  .hint { color: var(--mute); font-size: 13px; margin: -8px 0 14px; }
  .saved { color: var(--go); font-size: 13px; }
  .msg { color: var(--mute); padding: 40px 0; text-align: center; }
  footer { color: var(--mute); font-size: 12px; margin-top: 30px; }
  @media (max-width: 520px) { .tiles { grid-template-columns: 1fr 1fr; } .tile:first-child { grid-column: 1 / -1; } }
</style>
</head>
<body>
<main>
  <div class="k">NOOCAP Media · sponsor deals</div>
  <h1 id="who">Your earnings</h1>
  <div id="app"><div class="msg">Loading…</div></div>
  <footer id="foot"></footer>
</main>
<script>
(() => {
  const app = document.getElementById('app');
  const key = new URLSearchParams(location.search).get('k') || '';
  const money = (n) => '$' + Math.round(n).toLocaleString('en-US');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const day = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
  const monthOf = (d) => d ? new Date(d.slice(0, 7) + '-01T00:00:00').toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) : 'Date to come';
  let data = null, tab = 'all', openKey = null, flash = '';

  function render() {
    const vids = data.videos;
    const year = String(data.today || '').slice(0, 4);
    const paid = vids.filter((v) => v.paid && v.amount);
    const paidYear = paid.filter((v) => String(v.paidDate || v.date).startsWith(year)).reduce((a, v) => a + v.amount, 0);
    const owed = vids.filter((v) => !v.paid && v.amount && v.stage === 'Posted').reduce((a, v) => a + v.amount, 0);
    const coming = vids.filter((v) => !v.paid && v.amount && v.stage !== 'Posted').reduce((a, v) => a + v.amount, 0);
    const shown = vids.filter((v) => tab === 'all' || (tab === 'paid' ? v.paid : !v.paid));
    const groups = {};
    for (const v of shown) (groups[monthOf(v.date)] ||= []).push(v);
    const chip = (v) => v.paid ? `<span class="chip paid">Paid${v.paidDate ? ' ' + day(v.paidDate) : ''}</span>`
      : v.stage === 'Posted' ? `<span class="chip due">${v.invoiced ? 'Invoiced, awaiting payment' : 'Posted, payment pending'}</span>`
      : `<span class="chip up">${esc(v.stage)}</span>`;
    app.innerHTML = `
      <div class="tiles">
        <div class="tile go"><span class="k">Paid in ${esc(year)}</span><b>${money(paidYear)}</b></div>
        <div class="tile wait"><span class="k">Posted, not paid yet</span><b>${money(owed)}</b></div>
        <div class="tile"><span class="k">In the works</span><b>${money(coming)}</b></div>
      </div>
      <p class="hint">Tap a video to fill in or fix its amount, or mark it paid. Changes save straight to NOOCAP.</p>
      <div class="tabs">${[['all', 'All'], ['open', 'Not paid yet'], ['paid', 'Paid']].map(([k, l]) => `<button type="button" data-t="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${shown.length ? Object.entries(groups).map(([m, list]) => `
        <h2><span>${esc(m)}</span><span>${money(list.reduce((a, v) => a + (v.amount || 0), 0))}</span></h2>
        ${list.map((v) => `<div class="row${openKey === v.key ? ' open' : ''}" data-k="${esc(v.key)}"><span class="t">${esc(v.title)}</span><span class="amt">${v.amount ? money(v.amount) : '—'}</span>
          <span class="sub">${esc(v.brand || '')}${v.date ? ' · ' + (v.stage === 'Posted' ? 'posted ' : 'posting ') + day(v.date) : ''}${!v.paid && v.expected ? ' · payment expected ' + day(v.expected) : ''}${flash === v.key ? ' · <span class="saved">Saved</span>' : ''}</span>${chip(v)}${openKey === v.key ? editor(v) : ''}</div>`).join('')}`).join('')
        : '<div class="msg">Nothing here yet.</div>'}`;
    app.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { tab = b.dataset.t; render(); });
    app.querySelectorAll('.row').forEach((el) => el.onclick = (e) => {
      if (e.target.closest('.ed')) return;
      openKey = openKey === el.dataset.k ? null : el.dataset.k; flash = ''; render();
    });
    const ed = app.querySelector('.ed');
    if (ed) {
      const paid = ed.querySelector('[name=paid]'), pd = ed.querySelector('[name=paidDate]');
      paid.onchange = () => { pd.disabled = !paid.checked; if (paid.checked && !pd.value) pd.value = data.today; };
      ed.querySelector('[data-cancel]').onclick = () => { openKey = null; render(); };
      ed.querySelector('form').onsubmit = (e) => { e.preventDefault(); save(ed); };
    }
  }

  function editor(v) {
    return `<div class="ed"><form style="display:contents">
      <label>Amount (USD)<input type="text" inputmode="decimal" name="amount" value="${v.amount ?? ''}" placeholder="e.g. 1500"></label>
      <label>Invoice sent on<input type="date" name="invoiced" value="${esc(v.invoiced)}"></label>
      <span class="chk"><input type="checkbox" name="paid" id="pd_${esc(v.key)}" ${v.paid ? 'checked' : ''}><label for="pd_${esc(v.key)}" style="display:inline;color:var(--ink);font-size:14px">Paid</label></span>
      <label>Paid on<input type="date" name="paidDate" value="${esc(v.paidDate)}" ${v.paid ? '' : 'disabled'}></label>
      <div class="acts"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" data-cancel>Cancel</button><span class="err"></span></div>
    </form></div>`;
  }

  async function save(ed) {
    const v = data.videos.find((x) => x.key === openKey);
    if (!v) return;
    const f = ed.querySelector('form'), btn = f.querySelector('[type=submit]'), err = f.querySelector('.err');
    const amountRaw = f.amount.value.trim().replace(/[$,\s]/g, '');
    if (amountRaw && !(Number(amountRaw) >= 0)) { err.textContent = 'Amount must be a number'; return; }
    const body = { k: key, key: v.key };
    const amount = amountRaw === '' ? null : Number(amountRaw);
    if (amount !== (v.amount ?? null)) body.amount = amount;
    if (f.paid.checked !== v.paid || (f.paid.checked && f.paidDate.value !== (v.paidDate || ''))) { body.paid = f.paid.checked; body.paidDate = f.paidDate.value; }
    if ((f.invoiced.value || '') !== (v.invoiced || '')) body.invoiced = f.invoiced.value;
    if (Object.keys(body).length === 2) { openKey = null; render(); return; }
    btn.disabled = true; err.textContent = '';
    try {
      const r = await fetch('/api/revenue', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Not saved');
      if ('amount' in body) v.amount = body.amount;
      if ('paid' in body) { v.paid = body.paid; v.paidDate = body.paid ? (body.paidDate || data.today) : ''; }
      if ('invoiced' in body) v.invoiced = body.invoiced;
      flash = v.key; openKey = null; render();
    } catch (e) { err.textContent = e.message; btn.disabled = false; }
  }

  async function load() {
    if (!key) { app.innerHTML = '<div class="msg">This link is missing its key. Ask NOOCAP for your link.</div>'; return; }
    try {
      const r = await fetch('/api/revenue?k=' + encodeURIComponent(key), { cache: 'no-store' });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Could not load');
      data = j;
      document.getElementById('who').textContent = `${j.creator}'s sponsor earnings`;
      document.title = `${j.creator} · Sponsor Earnings`;
      document.getElementById('foot').textContent = 'Updated ' + new Date(j.generated_at).toLocaleString() + ' · live from NOOCAP';
      render();
    } catch (e) { app.innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
  }
  load();
})();
</script>
</body>
</html>
