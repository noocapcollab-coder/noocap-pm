<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Creator Dashboard</title>
<style>
  :root { --bg:#0d0e11; --card:#15171c; --line:#252931; --ink:#eef0f3; --mute:#8b919c; --go:#3ccf8e; --wait:#f2b84b; --acc:#8b7cff; --bar:#8b7cff; --red:#ff6b6b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6eb; --ink:#14161a; --mute:#636a75; --go:#13905a; --wait:#a46900; --acc:#5b4bd8; --bar:#6b5ce7; --red:#c93c3c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 28px 16px 64px; }
  .k { color: var(--mute); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 4px 0 4px; font-size: 28px; letter-spacing: -.02em; }
  .upd { color: var(--mute); font-size: 13px; margin-bottom: 22px; }
  h2 { font-size: 15px; margin: 34px 0 12px; font-weight: 650; }
  .tiles { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
  .tile, .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .tile b { display:block; font-size: 24px; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .tile small { color: var(--mute); font-size: 12px; }
  .up { color: var(--go); } .down { color: var(--red); } .go b { color: var(--go); } .wait b { color: var(--wait); }
  .plats { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .plat .name { display:flex; justify-content:space-between; font-size:13px; color:var(--mute); }
  .plat b { font-size: 22px; font-variant-numeric: tabular-nums; }
  svg.spark { width:100%; height:38px; margin-top:8px; display:block; }
  .bars { display:flex; align-items:flex-end; gap:6px; height:150px; padding-top:10px; }
  .bars div { flex:1; background:var(--bar); border-radius:5px 5px 2px 2px; min-height:2px; position:relative; opacity:.85; }
  .bars div:hover { opacity:1; }
  .bars div span { position:absolute; bottom:100%; left:50%; transform:translate(-50%,-4px); font-size:11px; color:var(--mute); white-space:nowrap; display:none; }
  .bars div:hover span { display:block; }
  .axis { display:flex; gap:6px; margin-top:6px; } .axis span { flex:1; text-align:center; font-size:10px; color:var(--mute); }
  table { width:100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align:right; padding:9px 6px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--mute); font-weight:500; font-size:12px; } th:first-child, td:first-child { text-align:left; text-transform: capitalize; }
  tr:last-child td { border-bottom:0; }
  .tops { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
  .top { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; text-decoration:none; color:inherit; display:flex; flex-direction:column; }
  .top img { width:100%; aspect-ratio: 9/14; object-fit:cover; background:var(--line); display:block; }
  .top .ph { width:100%; aspect-ratio:9/14; background:var(--line); display:grid; place-items:center; color:var(--mute); font-size:28px; }
  .top .meta { padding:9px 10px; font-size:12px; color:var(--mute); }
  .top .meta b { color:var(--ink); font-size:15px; display:block; }
  .row { display:grid; grid-template-columns: 1fr auto auto; gap:12px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .t { font-weight:600; } .row .sub { color:var(--mute); font-size:12px; }
  .amt { font-weight:700; font-variant-numeric: tabular-nums; text-align:right; }
  .chip { font-size:12px; border-radius:999px; padding:3px 10px; white-space:nowrap; }
  .chip.Paid { background: color-mix(in srgb, var(--go) 16%, transparent); color: var(--go); }
  .chip.Awaiting { background: color-mix(in srgb, var(--wait) 18%, transparent); color: var(--wait); }
  .chip.In { background: color-mix(in srgb, var(--acc) 16%, transparent); color: var(--acc); }
  .card.flush { padding:0; }
  .tabs { display:flex; gap:6px; margin: 0 0 18px; border-bottom:1px solid var(--line); }
  .tabs button { background:none; border:0; border-bottom:2px solid transparent; color:var(--mute); font:inherit; font-weight:600; padding:10px 4px; margin-right:14px; cursor:pointer; }
  .tabs button.on { color:var(--ink); border-color: var(--acc); }
  .batch { padding:12px 14px; border-bottom:1px solid var(--line); }
  .batch:last-child { border-bottom:0; }
  .batch .head { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  .batch .head b { font-variant-numeric: tabular-nums; white-space:nowrap; }
  .vers { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .vers a, .vers span { font-size:12px; color:var(--mute); border:1px solid var(--line); border-radius:999px; padding:3px 9px; text-decoration:none; font-variant-numeric: tabular-nums; }
  .vers a.best { color:var(--acc); border-color: color-mix(in srgb, var(--acc) 50%, transparent); }
  .note { color: var(--mute); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .week { display:grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .week .wk { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .week small { font-size: 11px; color: var(--mute); }
  .week small.up { color: var(--go); } .week small.down { color: var(--red); }
  .bars.days { gap: 3px; }
  .wkhead { display:flex; justify-content:space-between; align-items:baseline; margin: 18px 2px 8px; font-size: 14px; }
  .wkhead span { color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; }
  .vid { display:grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items:center; padding: 10px 12px; border-bottom: 1px solid var(--line); text-decoration:none; color:inherit; }
  .vid:last-child { border-bottom: 0; }
  .vid img, .vid .ph { width:44px; height:62px; object-fit:cover; border-radius:6px; background:var(--line); display:grid; place-items:center; color:var(--mute); font-size:14px; }
  .vid .t { font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .vid .sub { color:var(--mute); font-size:12px; margin-top:2px; }
  .vs { display:grid; grid-template-columns: repeat(4, 64px); text-align:right; font-variant-numeric: tabular-nums; }
  .vs span { font-size:11px; color:var(--mute); } .vs b { display:block; color:var(--ink); font-size:15px; }
  @media (max-width: 680px) { .week { grid-template-columns: repeat(2, 1fr); } .vid { grid-template-columns: 44px 1fr; } .vs { grid-column: 1 / -1; grid-template-columns: repeat(4, 1fr); text-align:left; } }
  .msg { color: var(--mute); padding: 60px 0; text-align:center; }
  @media (max-width: 680px) { .tiles { grid-template-columns: repeat(2, 1fr); } .plats { grid-template-columns: 1fr; } .tops { grid-template-columns: repeat(2, 1fr); } .row { grid-template-columns: 1fr auto; } .row .chip { grid-column: 1; justify-self:start; } }
</style>
</head>
<body>
<main id="app"><div class="msg">Loading…</div></main>
<script>
const k = new URLSearchParams(location.search).get('k') || '';
const $ = (h) => { document.getElementById('app').innerHTML = h; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const num = (v) => Number(v || 0).toLocaleString('en-US');
const short = (v) => { v = Number(v || 0); return v >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : v >= 1e4 ? Math.round(v / 1e3) + 'K' : v >= 1e3 ? (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(v); };
const usd = (v) => '$' + Number(v || 0).toLocaleString('en-US');
const date = (d) => d ? new Date(d + (String(d).length === 10 ? 'T00:00:00' : '')).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
let tab = 'overview', last = null;
try { tab = localStorage.getItem('cdTab') || 'overview'; } catch {}
function setTab(t) { tab = t; try { localStorage.setItem('cdTab', t); } catch {} render(last); }
const PL = { instagram: 'Instagram', tiktok: 'TikTok', youtube: 'YouTube' };

function spark(hist) {
  if (!hist || hist.length < 2) return '';
  const v = hist.map((h) => h.followers), lo = Math.min(...v), hi = Math.max(...v), r = hi - lo || 1;
  const pts = v.map((x, i) => `${(i / (v.length - 1)) * 100},${36 - ((x - lo) / r) * 32}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 38" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function trialsHtml(t) {
  if (!t) return `<div class="card" style="color:var(--mute)">No trial reels posted yet. They will show here, with views for each hook version, as soon as the first ones go live.</div>`;
  let h = `<div class="tiles">
    <div class="tile"><span class="k">Trial reels</span><b>${num(t.reels)}</b><small>${num(t.videos)} videos tested</small></div>
    <div class="tile"><span class="k">Views</span><b>${short(t.views)}</b><small>all trial reels</small></div>
    <div class="tile"><span class="k">Avg per reel</span><b>${short(t.perReel)}</b><small>views</small></div>
    <div class="tile"><span class="k">${t.follows != null ? 'Follows' : 'Saves'}</span><b>${num(t.follows != null ? t.follows : t.saves)}</b><small>${t.follows != null ? 'from trial reels' : 'on trial reels'}</small></div>
  </div>`;
  h += `<h2>Each video and its hook versions</h2><div class="card flush">` + t.batches.map((b) => `<div class="batch">
    <div class="head"><div><div class="t" style="font-weight:600">${esc(b.title || 'Video')}</div><div class="sub" style="color:var(--mute);font-size:12px">${num(b.count)} version${b.count === 1 ? '' : 's'} · posted ${date(b.postedAt)}</div></div><b>${short(b.views)} views</b></div>
    <div class="vers">${b.versions.map((v, i) => v.url ? `<a class="${i === 0 && b.count > 1 ? 'best' : ''}" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">${i === 0 && b.count > 1 ? '★ ' : ''}${v.pending ? 'just posted' : short(v.views)}</a>` : `<span>${v.pending ? 'just posted' : short(v.views)}</span>`).join('')}</div>
  </div>`).join('') + `</div>`;
  return h;
}

function render(d) {
  if (!d) return; last = d;
  document.title = `${d.creator} · Dashboard`;
  const c = d.content, a = d.audience, w = d.week;
  // This week and last week come from the same video list shown below, so the totals always match it
  if (w && d.recent && d.recent.length) {
    const sum = (i) => d.recent.filter((v) => v.week === i).reduce((t, v) => ({ views: t.views + v.views, likes: t.likes + v.likes, comments: t.comments + v.comments, shares: t.shares + v.shares, saves: t.saves + v.saves, posts: t.posts + 1 }), { views: 0, likes: 0, comments: 0, shares: 0, saves: 0, posts: 0 });
    w.thisWeek = sum(0); w.lastWeek = sum(1);
    w.viewsChange = w.lastWeek.views ? Math.round(((w.thisWeek.views - w.lastWeek.views) / w.lastWeek.views) * 100) : null;
  }
  const arrow = (v, label) => v == null ? '<small>&nbsp;</small>' : `<small class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '▲' : '▼'} ${Math.abs(v)}% ${label}</small>`;
  // followers gained in the last 7 days, from each account's daily history
  const weekAgo = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  const gained7 = a ? a.accounts.reduce((t, x) => { const h = x.history || []; if (!h.length) return t; const base = [...h].reverse().find((p) => p.date <= weekAgo) || h[0]; return t + (x.followers - base.followers); }, 0) : null;
  let h = `<div class="k">Creator dashboard</div><h1>${esc(d.creator)}</h1>
  <div class="upd">Updated ${new Date(d.updated).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</div>
  <div class="tabs"><button class="${tab === 'overview' ? 'on' : ''}" onclick="setTab('overview')">Overview</button><button class="${tab === 'trials' ? 'on' : ''}" onclick="setTab('trials')">Trial reels</button></div>
  ${tab === 'trials' ? trialsHtml(d.trials) : `<div class="tiles">
    <div class="tile"><span class="k">Followers</span><b>${a ? num(a.total) : '–'}</b><small class="${gained7 > 0 ? 'up' : ''}">${gained7 != null ? (gained7 >= 0 ? '+' : '') + num(gained7) + ' this week' : 'all platforms'}</small></div>
    <div class="tile"><span class="k">Views this week</span><b>${w ? short(w.thisWeek.views) : '–'}</b>${w ? arrow(w.viewsChange, 'vs last week') : ''}</div>
    <div class="tile go"><span class="k">Earned from brand deals</span><b>${usd(d.earned)}</b><small>paid so far</small></div>
    <div class="tile wait"><span class="k">Awaiting payment</span><b>${usd(d.awaiting)}</b><small>invoiced or posted</small></div>
  </div>`}`;
  if (tab === 'trials') return $(h);

  if (w) {
    const cell = (label, now, prev) => { const ch = prev ? Math.round(((now - prev) / prev) * 100) : null;
      return `<div><span class="k">${label}</span><div class="wk">${short(now)}</div><small class="${ch == null ? '' : ch >= 0 ? 'up' : 'down'}">${ch == null ? 'last week ' + short(prev) : (ch >= 0 ? '▲ ' : '▼ ') + Math.abs(ch) + '% · last week ' + short(prev)}</small></div>`; };
    h += `<h2>This week <span class="note">last 7 days, against the 7 days before</span></h2><div class="card week">
      ${cell('Videos posted', w.thisWeek.posts, w.lastWeek.posts)}${cell('Views', w.thisWeek.views, w.lastWeek.views)}${cell('Likes', w.thisWeek.likes, w.lastWeek.likes)}${cell('Comments', w.thisWeek.comments, w.lastWeek.comments)}${cell('Saves', w.thisWeek.saves, w.lastWeek.saves)}</div>`;
    const max = Math.max(1, ...w.days.map((x) => x.views));
    h += `<h2>Views per day <span class="note">last 4 weeks</span></h2><div class="card"><div class="bars days">${w.days.map((x) => `<div style="height:${(x.views / max) * 100}%"><span>${date(x.date)} · ${short(x.views)}</span></div>`).join('')}</div>
      <div class="axis">${w.days.map((x, i) => `<span>${i % 7 ? '' : date(x.date)}</span>`).join('')}</div></div>`;
  }

  if (a) {
    h += `<h2>Audience</h2><div class="plats">` + a.accounts.map((x) => `<div class="card plat">
      <div class="name"><span>${PL[x.platform] || esc(x.platform)}</span><span>@${esc(x.username)}</span></div>
      <b>${num(x.followers)}</b>
      ${x.gained != null && x.since ? `<div class="${x.gained >= 0 ? 'up' : 'down'}" style="font-size:12px">${x.gained >= 0 ? '+' : ''}${num(x.gained)} since ${date(x.since)}</div>` : ''}
      ${spark(x.history)}</div>`).join('') + `</div>`;
  }

  if (d.recent && d.recent.length) {
    const WK = ['This week', 'Last week', '2 weeks ago', '3 weeks ago', '4 weeks ago'];
    h += `<h2>Every video, week by week <span class="note">numbers keep growing as each video gets more views</span></h2>`;
    for (let i = 0; i < WK.length; i++) {
      const list = d.recent.filter((v) => Math.min(v.week, 4) === i);
      if (!list.length) continue;
      const tot = list.reduce((t, v) => t + v.views, 0);
      h += `<div class="wkhead"><b>${WK[i]}</b><span>${list.length} video${list.length === 1 ? '' : 's'} · ${short(tot)} views</span></div><div class="card flush">` + list.map((v) => `<a class="vid" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">
        ${v.thumb ? `<img src="${esc(v.thumb)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'▶'}))">` : '<div class="ph">▶</div>'}
        <div class="vt"><div class="t">${esc(v.title || 'Video')}</div><div class="sub">${PL[v.platform] || esc(v.platform)} · ${date(v.at)}</div></div>
        <div class="vs"><span><b>${short(v.views)}</b>views</span><span><b>${short(v.likes)}</b>likes</span><span><b>${short(v.comments)}</b>comments</span><span><b>${short(v.saves)}</b>saves</span></div></a>`).join('') + `</div>`;
    }
  }

  const paidN = d.deals.filter((x) => x.status === 'Paid').length;
  h += `<h2>Brand deals</h2><div class="card" style="margin-bottom:10px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;align-items:end">
    <div><span class="k">Earned so far</span><div style="font-size:34px;font-weight:750;color:var(--go);letter-spacing:-.02em;font-variant-numeric:tabular-nums">${usd(d.earned)}</div><small style="color:var(--mute)">from ${paidN} paid deal${paidN === 1 ? '' : 's'}</small></div>
    <div><span class="k">Awaiting</span><div style="font-size:20px;font-weight:700;color:var(--wait)">${usd(d.awaiting)}</div></div>
    <div><span class="k">In progress</span><div style="font-size:20px;font-weight:700;color:var(--acc)">${usd(d.inProgress)}</div></div></div>`;
  h += d.deals.length ? `<div class="card flush">` + d.deals.map((x) => `<div class="row">
      <div><div class="t">${esc(x.brand)}</div><div class="sub">${x.status === 'Paid' && x.paidDate ? 'Paid ' + date(x.paidDate) : 'Started ' + date(x.started)}</div></div>
      <span class="chip ${x.status.split(' ')[0]}">${esc(x.status)}</span>
      <div class="amt">${x.amount ? usd(x.amount) : '–'}</div></div>`).join('') + `</div>`
    : `<div class="card" style="color:var(--mute)">No brand deals yet.</div>`;
  $(h);
}

async function load() {
  if (k.length < 20) return $('<div class="msg">This link is not valid.</div>');
  try {
    const r = await fetch('/api/creator?k=' + encodeURIComponent(k), { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) return $(`<div class="msg">${esc(j.error || 'Could not load')}</div>`);
    render(j);
  } catch { $('<div class="msg">Could not load right now, try again in a minute.</div>'); }
}
load();
setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
