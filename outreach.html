<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NOOCAP Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0e11; --panel:#14161b; --panel2:#1a1d23; --line:#23262d; --line2:#2d3139; --text:#e9e7e2; --muted:#9ea2ab; --dim:#6b7079; --accent:#3dd6b0; --accent-ink:#062b22; --warn:#f2b84b; --bad:#ff6b6b; --blue:#7c9cff; --r:14px; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:1180px; margin:0 auto; padding:22px 16px 60px; }
  h1 { font:600 24px 'Space Grotesk', sans-serif; margin:0; }
  h2 { font:600 15px 'Space Grotesk', sans-serif; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  h2 .r { margin-left:auto; color:var(--muted); font:500 12px 'IBM Plex Sans'; }
  .top { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; margin-bottom:18px; }
  .top .sub { color:var(--muted); font-size:13px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line); color:var(--muted); }
  .pill.on { color:var(--accent); border-color:rgba(61,214,176,.4); }
  .pill.off { color:var(--warn); border-color:rgba(242,184,75,.4); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:18px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; }
  .kpi .l { color:var(--muted); font-size:12px; } .kpi .v { font:600 22px 'Space Grotesk'; margin-top:2px; font-variant-numeric:tabular-nums; }
  .creators { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .creators button { background:var(--panel); border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:8px 12px; font:600 13px 'Space Grotesk'; cursor:pointer; display:flex; gap:7px; align-items:center; }
  .creators button.sel { color:var(--text); border-color:var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); } .dot.Running { background:var(--accent); box-shadow:0 0 8px var(--accent); } .dot.Paused { background:var(--warn); }
  .grid { display:grid; grid-template-columns: 1.4fr 1fr; gap:14px; align-items:start; }
  @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px; min-width:0; margin-bottom:14px; }
  label { display:block; color:var(--muted); font-size:12px; margin:10px 0 4px; }
  input, textarea, select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line2); border-radius:9px; padding:9px 11px; font:inherit; }
  textarea { min-height:220px; resize:vertical; line-height:1.55; } textarea.short { min-height:90px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .hint { color:var(--dim); font-size:12px; margin-top:6px; }
  .btn { background:var(--accent); color:var(--accent-ink); border:0; border-radius:9px; padding:9px 15px; font:600 13px 'IBM Plex Sans'; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line2); } .btn.warn { background:var(--warn); color:#2a1c00; } .btn.bad { background:transparent; color:var(--bad); border:1px solid rgba(255,107,107,.4); }
  .btn:disabled { opacity:.55; cursor:wait; }
  .acts { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; }
  .msg { font-size:13px; } .msg.ok { color:var(--accent); } .msg.err { color:var(--bad); }
  .stat { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); } .stat:last-child { border:0; } .stat b { font-variant-numeric:tabular-nums; }
  .sample { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; white-space:pre-wrap; font-size:13px; margin-top:8px; }
  .list { max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:10px; margin-top:8px; }
  .list div { display:flex; justify-content:space-between; gap:10px; padding:6px 10px; border-bottom:1px solid var(--line); font-size:13px; } .list div span:last-child { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; } th { text-align:left; color:var(--muted); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line); } td { padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .tbl { overflow-x:auto; }
  .tag { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel2); color:var(--muted); white-space:nowrap; }
  .tag.Sent, .tag.Follow-up-1-sent, .tag.Follow-up-2-sent { color:var(--blue); } .tag.Replied, .tag.Interested { color:var(--accent); } .tag.Bounced, .tag.Failed, .tag.Not-interested { color:var(--bad); }
  .reply { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .reply .h { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .reply .t { white-space:pre-wrap; color:var(--muted); font-size:13px; margin-top:6px; }
  .gate { max-width:360px; margin:12vh auto; } .muted { color:var(--muted); }
</style>
</head>
<body>
<main id="app"><div class="muted">Loading…</div></main>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  let key = store.get('pmKey') || '';
  const H = () => ({ 'content-type': 'application/json', 'x-pm-key': key });
  const app = $('#app');
  let data = null, sel = store.get('outSel') || 'Chris', prev = null, note = {};
  const ist = (iso) => iso ? new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';

  function gate(err) {
    app.innerHTML = `<form class="card gate"><h2>NOOCAP Outreach</h2><label>PM password</label><input id="pw" type="password" autofocus><div class="acts"><button class="btn">Open</button><span class="msg err">${esc(err || '')}</span></div></form>`;
    $('form').onsubmit = (e) => { e.preventDefault(); key = $('#pw').value.trim(); store.set('pmKey', key); load(); };
  }

  async function api(path, body) {
    const r = await fetch('/api/outreach' + path, body ? { method: 'POST', headers: H(), body: JSON.stringify(body) } : { headers: H(), cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { gate('Wrong password'); throw new Error('locked'); }
    if (!r.ok) throw new Error(j.error || 'Failed');
    return j;
  }

  async function load() {
    try { data = await api(''); render(); } catch (e) { if (e.message !== 'locked') app.innerHTML = `<div class="card msg err">${esc(e.message)}</div>`; }
  }

  function render() {
    const c = data.campaigns.find((x) => x.creator === sel) || data.campaigns[0];
    sel = c.creator;
    const st = data.stats[sel] || {};
    const all = Object.values(data.stats).reduce((a, s) => { for (const k in s) a[k] = (a[k] || 0) + s[k]; return a; }, {});
    const running = data.campaigns.filter((x) => x.status === 'Running').map((x) => x.creator);
    const S = data.settings;
    app.innerHTML = `
      <div class="top">
        <div><div class="sub">NOOCAP · brand outreach from ${esc(S.from)}</div><h1>Outreach</h1></div>
        <span class="pill ${data.inWindow ? 'on' : 'off'}">${data.inWindow ? 'Sending window open' : 'Outside sending window'} · Mon–Fri 7:30pm–3:30am IST</span>
        <span class="pill">${data.sentToday}/${S.dailyCap} sent today · one every ${S.gapMin}+ min</span>
        <span class="pill">${running.length ? 'Running: ' + esc(running.join(', ')) : 'Nothing running'}</span>
        <button class="btn ghost" id="refresh" style="margin-left:auto">Refresh</button>
      </div>
      <div class="kpis">
        ${[['Emails sent', all.sent], ['Follow-ups', all.followedUp], ['Replies', all.replied], ['Interested', all.interested], ['Waiting to send', all.queued], ['Bounced / failed', (all.bounced || 0) + (all.failed || 0)]].map(([l, v]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v || 0}</div></div>`).join('')}
      </div>
      ${data.replies.length ? `<div class="card"><h2>Replies <span class="r">${data.replies.length} · newest first</span></h2>${data.replies.slice(0, 40).map(replyCard).join('')}</div>` : ''}
      <div class="creators">${data.campaigns.map((x) => `<button type="button" data-c="${esc(x.creator)}" class="${x.creator === sel ? 'sel' : ''}"><span class="dot ${x.status}"></span>${esc(x.creator)}${data.stats[x.creator]?.sent ? ` <span class="muted">${data.stats[x.creator].sent}</span>` : ''}</button>`).join('')}</div>
      <div class="grid">
        <form class="card" id="tpl">
          <h2>${esc(sel)}'s email <span class="r">${c.usesDefault ? 'using the template from Notion' : 'saved'}</span></h2>
          <div class="row2">
            <div><label>Follower count (fills "X+ followers")</label><input name="followers" value="${esc(c.followers)}" placeholder="e.g. 500K"></div>
            <div><label>${esc(sel)} is</label><select name="pronoun">${['he', 'she', 'they'].map((p) => `<option ${c.pronoun === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
          </div>
          <label>Subject</label><input name="subject" value="${esc(c.subject)}" placeholder="{creator} x {brand}">
          <label>Email</label><textarea name="body">${esc(c.body)}</textarea>
          <div class="hint">Use [creator], {brand} and "X+ followers" and they fill in for every brand. Write he/his and it switches to she/her or they/their.</div>
          <label>Follow-up 1 · sent ${S.followUp1Days} days later if no reply (leave empty for none)</label><textarea class="short" name="followUp1">${esc(c.followUp1)}</textarea>
          <label>Follow-up 2 · sent ${S.followUp2Days} days after that</label><textarea class="short" name="followUp2">${esc(c.followUp2)}</textarea>
          <div class="acts"><button class="btn" type="submit">Save</button>
            <input name="testTo" placeholder="your email for a test" style="width:220px"><button class="btn ghost" type="button" id="test">Send me a test</button>
            <span class="msg ${note.tplErr ? 'err' : 'ok'}">${esc(note.tpl || '')}</span></div>
        </form>
        <div>
          <div class="card">
            <h2>${esc(sel)} <span class="tag">${esc(c.status)}</span><span class="r">${c.started ? 'started ' + ist(c.started) : ''}</span></h2>
            ${[['Waiting to send', st.queued], ['Emails sent', st.sent], ['Follow-ups sent', st.followedUp], ['Replies', st.replied], ['Interested', st.interested], ['Bounced', st.bounced], ['Failed', st.failed]].map(([l, v]) => `<div class="stat"><span>${l}</span><b>${v || 0}</b></div>`).join('')}
            <div class="acts">
              ${c.status === 'Running' ? `<button class="btn warn" data-a="pause">Pause</button>` : `<button class="btn" data-a="preview">${c.status === 'Paused' ? 'Resume…' : 'Start outreach…'}</button>`}
              ${c.status !== 'Off' ? `<button class="btn bad" data-a="stop">Stop</button>` : ''}
              <span class="msg ${note.runErr ? 'err' : 'ok'}">${esc(note.run || '')}</span>
            </div>
          </div>
          ${prev && prev.creator === sel ? `<div class="card"><h2>Before you start <span class="r">${prev.count} brands</span></h2>
            <div class="muted" style="font-size:13px">${prev.count ? `${prev.count} brands that made a paid offer to another creator in the last 6 months. Skipped: brands that already talk to ${esc(sel)}, Do Not Contact, anyone pitched for ${esc(sel)} in the last 60 days, and brands working with another creator right now.` : 'No brands match right now.'}</div>
            ${prev.count ? `<label>First email (to ${esc(prev.sample.to)})</label><div class="sample"><b>${esc(prev.sample.subject)}</b>\n\n${esc(prev.sample.text)}</div>
            <div class="list">${prev.brands.map((b) => `<div><span>${esc(b.brand)}</span><span>${esc(b.to)}</span></div>`).join('')}</div>
            <div class="acts"><button class="btn" data-a="start">Start: email these brands</button><button class="btn ghost" data-a="cancel">Cancel</button></div>` : ''}</div>` : ''}
        </div>
      </div>
      <div class="card"><h2>Sent log <span class="r">last ${data.recent.length}</span></h2><div class="tbl"><table>
        <tr><th>When (IST)</th><th>Creator</th><th>Brand</th><th>To</th><th>Status</th></tr>
        ${data.recent.map((r) => `<tr><td>${ist(r.lastSentAt) || '—'}</td><td>${esc(r.creator)}</td><td>${esc(r.brand)}</td><td class="muted">${esc(r.to)}</td><td><span class="tag ${esc(String(r.status).replace(/\s+/g, '-'))}">${esc(r.status)}</span>${r.error ? `<div class="muted" style="font-size:12px">${esc(r.error)}</div>` : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nothing sent yet.</td></tr>'}
      </table></div></div>`;
    bind(c);
  }

  function replyCard(r) {
    return `<div class="reply"><div class="h"><b>${esc(r.brand)}</b><span class="muted">for ${esc(r.creator)}</span><span class="tag ${esc(String(r.status).replace(/\s+/g, '-'))}">${esc(r.status)}</span>
      <span style="margin-left:auto;display:flex;gap:6px">${r.status !== 'Interested' ? `<button class="btn ghost" data-st="Interested" data-id="${r.id}">Interested</button>` : ''}${r.status !== 'Not interested' ? `<button class="btn bad" data-st="Not interested" data-id="${r.id}">Not interested</button>` : ''}</span></div>
      <div class="t">${esc(r.reply)}</div><div class="hint">Open the full email in harshkoli201@gmail.com to reply.</div></div>`;
  }

  function bind(c) {
    $('#refresh').onclick = load;
    app.querySelectorAll('[data-c]').forEach((b) => b.onclick = () => { sel = b.dataset.c; store.set('outSel', sel); note = {}; render(); });
    const f = $('#tpl');
    const fields = () => ({ subject: f.subject.value, body: f.body.value, followUp1: f.followUp1.value, followUp2: f.followUp2.value, followers: f.followers.value, pronoun: f.pronoun.value });
    f.onsubmit = async (e) => { e.preventDefault(); await act({ action: 'save', creator: sel, ...fields() }, 'tpl', 'Saved'); };
    $('#test').onclick = async () => { await act({ action: 'save', creator: sel, ...fields() }, 'tpl', ''); await act({ action: 'test', creator: sel, to: f.testTo.value }, 'tpl', 'Test sent, check your inbox'); };
    app.querySelectorAll('[data-a]').forEach((b) => b.onclick = async () => {
      const a = b.dataset.a;
      if (a === 'cancel') { prev = null; return render(); }
      if (a === 'preview') {
        b.disabled = true;
        try { await api('', { action: 'save', creator: sel, ...fields() }); prev = await api('?preview=' + encodeURIComponent(sel)); note = {}; } catch (e) { note = { run: e.message, runErr: 1 }; }
        return render();
      }
      if (a === 'stop' && !confirm(`Stop outreach for ${sel}? Brands not emailed yet are taken off the list (already-sent emails and replies stay).`)) return;
      await act({ action: a, creator: sel }, 'run', a === 'start' ? 'Started. The first email goes out in the next sending slot.' : a === 'pause' ? 'Paused' : 'Stopped');
      if (a === 'start') prev = null;
    });
    app.querySelectorAll('[data-st]').forEach((b) => b.onclick = () => act({ action: 'status', id: b.dataset.id, status: b.dataset.st }, 'run', ''));
  }

  async function act(body, slot, okText) {
    app.querySelectorAll('button').forEach((x) => x.disabled = true);
    try { await api('', body); note = okText ? { [slot]: okText } : note; data = await api(''); }
    catch (e) { note = { [slot]: e.message, [slot + 'Err']: 1 }; }
    render();
  }

  load();
  setInterval(() => { if (data && document.visibilityState === 'visible' && !document.activeElement?.closest('form')) load(); }, 60000);
})();
</script>
</body>
</html>
