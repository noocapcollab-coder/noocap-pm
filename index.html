<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOOCAP PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10; --panel: #12151a; --panel2: #171b21; --line: #232932; --text: #e7eaee; --muted: #8a93a0;
    --accent: #5eead4; --accent-ink: #062b26; --warn: #fbbf24; --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .logo { font: 700 16px 'Space Grotesk', sans-serif; letter-spacing: .04em; }
  .logo span { color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  header .sub { color: var(--muted); font-size: 13px; }
  header button { margin-left: auto; }
  main { flex: 1; overflow-y: auto; padding: 24px 16px 8px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .msg { display: flex; margin: 0 0 18px; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 88%; padding: 12px 16px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 500; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin: 0; }
  .bubble ul { margin: 4px 0 8px; padding-left: 20px; } .bubble li { margin: 2px 0; }
  .bubble code { font: 13px 'IBM Plex Mono', monospace; background: #0b0d10; padding: 1px 5px; border-radius: 4px; }
  .bubble a { color: var(--accent); }
  .meta { font: 11px 'IBM Plex Mono', monospace; color: var(--muted); margin-top: 8px; }
  .err { color: var(--err); }
  .thinking { color: var(--muted); font-style: italic; }
  .intro { text-align: center; padding: 40px 0 20px; }
  .intro h1 { font: 600 26px 'Space Grotesk', sans-serif; margin: 0 0 6px; }
  .intro p { color: var(--muted); margin: 0 0 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  footer { padding: 12px 16px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  textarea { flex: 1; resize: none; min-height: 46px; max-height: 160px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: inherit; outline: none; }
  textarea:focus { border-color: var(--accent); }
  button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 0 18px; font: 600 14px 'Space Grotesk', sans-serif; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  .gate { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 16px; }
  .gate.show { display: flex; }
  .gate form { flex-direction: column; width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  .gate input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; }
  .gate button { padding: 12px; }
  @media (max-width: 600px) { header .sub { display: none; } .bubble { max-width: 94%; } }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <div class="logo">NOOCAP <span>PM</span></div>
  <div class="sub">Ask anything about deals, money, videos and the team</div>
  <button class="ghost" id="clear" type="button">New chat</button>
</header>
<main id="scroll"><div class="wrap" id="log">
  <div class="intro" id="intro">
    <h1>What do you want to know?</h1>
    <p>Reads live Notion: brand deals, sponsor revenue, creator boards and team activity.</p>
    <div class="chips">
      <button class="chip" type="button">How much cut are we owed across all creators?</button>
      <button class="chip" type="button">Which brand deals need a follow-up today?</button>
      <button class="chip" type="button">Any invoices overdue?</button>
      <button class="chip" type="button">What did each editor submit this week?</button>
      <button class="chip" type="button">Which videos are past their post date?</button>
      <button class="chip" type="button">How many scripts did Shreya send for approval this week?</button>
      <button class="chip" type="button">What do you remember?</button>
    </div>
  </div>
</div></main>
<footer>
  <form id="ask">
    <textarea id="q" rows="1" placeholder="Ask the PM…" autocomplete="off"></textarea>
    <button id="send" type="submit">Ask</button>
  </form>
</footer>
<div class="gate" id="gate">
  <form id="gateForm">
    <div class="logo" style="margin-bottom:6px">NOOCAP <span>PM</span></div>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button type="submit">Enter</button>
    <div class="err" id="gateErr" style="font-size:13px"></div>
  </form>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  let key = store.get('pmKey') || '';
  let history = [];
  let busy = false;

  // The password box only appears if a PM_PASSWORD is set in Vercel and the server asks for it.
  $('gateForm').onsubmit = (e) => {
    e.preventDefault();
    key = $('pw').value.trim();
    if (!key) return;
    store.set('pmKey', key);
    $('gate').classList.remove('show');
    $('q').focus();
  };

  function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">link</a>');
  }
  function md(text) {
    const out = []; let list = null;
    for (const raw of text.split('\n')) {
      const line = raw.trimEnd();
      const li = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
      if (li) { if (!list) { list = []; } list.push('<li>' + inline(li[1]) + '</li>'); continue; }
      if (list) { out.push('<ul>' + list.join('') + '</ul>'); list = null; }
      if (!line.trim()) continue;
      const h = line.match(/^#{1,4}\s+(.*)$/);
      out.push('<p>' + (h ? '<b>' + inline(h[1]) + '</b>' : inline(line)) + '</p>');
    }
    if (list) out.push('<ul>' + list.join('') + '</ul>');
    return out.join('');
  }

  function add(role, html, meta) {
    $('intro')?.remove();
    const row = document.createElement('div');
    row.className = 'msg ' + role;
    row.innerHTML = '<div class="bubble">' + html + (meta ? '<div class="meta">' + meta + '</div>' : '') + '</div>';
    $('log').appendChild(row);
    $('scroll').scrollTop = $('scroll').scrollHeight;
    return row;
  }

  async function ask(text) {
    if (busy || !text.trim()) return;
    busy = true; $('send').disabled = true;
    history.push({ role: 'user', content: text });
    add('user', esc(text).replace(/\n/g, '<br>'));
    const wait = add('assistant', '<span class="thinking">Checking Notion…</span>');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-pm-key': key },
        body: JSON.stringify({ messages: history, channel: 'dashboard' }),
      });
      const data = await res.json().catch(() => ({}));
      wait.remove();
      if (res.status === 401) {
        history.pop(); store.del('pmKey'); key = '';
        $('gateErr').textContent = 'Wrong password, try again.';
        $('gate').classList.add('show');
        return;
      }
      if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
      history.push({ role: 'assistant', content: data.reply });
      const meta = (data.tools_used?.length ? 'read ' + data.tools_used.join(', ') + ' · ' : '') + '$' + (data.usage?.cost_usd ?? 0).toFixed(4);
      add('assistant', md(data.reply), meta);
    } catch (e) {
      wait.remove();
      history.pop();
      add('assistant', '<span class="err">Something broke: ' + esc(e.message) + '</span>');
    } finally {
      busy = false; $('send').disabled = false; $('q').focus();
    }
  }

  $('ask').onsubmit = (e) => { e.preventDefault(); const t = $('q').value; $('q').value = ''; autosize(); ask(t); };
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('ask').requestSubmit(); } });
  function autosize() { const q = $('q'); q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 160) + 'px'; }
  $('q').addEventListener('input', autosize);
  document.querySelectorAll('.chip').forEach((c) => c.onclick = () => ask(c.textContent));
  $('clear').onclick = () => { history = []; location.reload(); };
</script>
</body>
</html>
