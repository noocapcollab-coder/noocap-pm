<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOOCAP PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10; --panel: #12151a; --panel2: #171b21; --line: #232932; --text: #e7eaee; --muted: #8a93a0;
    --accent: #5eead4; --accent-ink: #062b26; --warn: #fbbf24; --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .logo { font: 700 16px 'Space Grotesk', sans-serif; letter-spacing: .04em; }
  .logo span { color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  header .sub { color: var(--muted); font-size: 13px; }
  header button { margin-left: auto; }
  main { flex: 1; overflow-y: auto; padding: 24px 16px 8px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .msg { display: flex; margin: 0 0 18px; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 88%; padding: 12px 16px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 500; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin: 0; }
  .bubble ul { margin: 4px 0 8px; padding-left: 20px; } .bubble li { margin: 2px 0; }
  .bubble code { font: 13px 'IBM Plex Mono', monospace; background: #0b0d10; padding: 1px 5px; border-radius: 4px; }
  .bubble a { color: var(--accent); }
  .meta { font: 11px 'IBM Plex Mono', monospace; color: var(--muted); margin-top: 8px; }
  .err { color: var(--err); }
  .thinking { color: var(--muted); font-style: italic; }
  .intro { text-align: center; padding: 40px 0 20px; }
  .intro h1 { font: 600 26px 'Space Grotesk', sans-serif; margin: 0 0 6px; }
  .intro p { color: var(--muted); margin: 0 0 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  footer { padding: 12px 16px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  textarea { flex: 1; resize: none; min-height: 46px; max-height: 160px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: inherit; outline: none; }
  textarea:focus { border-color: var(--accent); }
  button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 0 18px; font: 600 14px 'Space Grotesk', sans-serif; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  .gate { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 16px; }
  .gate.show { display: flex; }
  .gate form { flex-direction: column; width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  .gate input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; }
  .gate button { padding: 12px; }
  .side { position: fixed; top: 0; left: 0; bottom: 0; width: 320px; max-width: 86vw; background: var(--panel); border-right: 1px solid var(--line); transform: translateX(-100%); transition: transform .2s ease; z-index: 20; display: flex; flex-direction: column; }
  .side.open { transform: none; }
  .side h2 { font: 600 15px 'Space Grotesk', sans-serif; margin: 0; padding: 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .side .list { overflow-y: auto; flex: 1; padding: 8px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
  .item:hover, .item.active { background: var(--panel2); }
  .item .t { flex: 1; min-width: 0; }
  .item .t div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .item .t small { color: var(--muted); font-size: 11px; }
  .item .del { background: none; color: var(--muted); padding: 2px 6px; font-size: 16px; opacity: 0; }
  .item:hover .del { opacity: 1; }
  .shade { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 15; display: none; }
  .shade.open { display: block; }
  .change { margin-top: 10px; border: 1px solid var(--warn); border-radius: 10px; padding: 10px 12px; background: rgba(251,191,36,.06); }
  .change .lbl { font: 600 11px 'IBM Plex Mono', monospace; color: var(--warn); letter-spacing: .06em; margin-bottom: 6px; }
  .change ul { margin: 0 0 10px; }
  .change .btns { display: flex; gap: 8px; }
  .change .btns button { padding: 8px 14px; }
  .change .state { font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 12px; }
  @media (max-width: 600px) { .item .del { opacity: 1; } }
  @media (max-width: 600px) { header .sub { display: none; } .bubble { max-width: 94%; } }
</style>
</head>
<body>
<header>
  <button class="ghost" id="histBtn" type="button" style="margin-left:0">☰ Chats</button>
  <div class="dot"></div>
  <div class="logo">NOOCAP <span>PM</span></div>
  <div class="sub">Ask anything about deals, money, videos and the team</div>
  <button class="ghost" id="clear" type="button">New chat</button>
</header>
<main id="scroll"><div class="wrap" id="log">
  <div class="intro" id="intro">
    <h1>What do you want to know?</h1>
    <p>Reads live Notion: brand deals, sponsor revenue, creator boards and team activity. Every chat is saved.</p>
  </div>
</div></main>
<footer>
  <form id="ask">
    <textarea id="q" rows="1" placeholder="Ask the PM…" autocomplete="off"></textarea>
    <button id="send" type="submit">Ask</button>
  </form>
</footer>
<div class="shade" id="shade"></div>
<aside class="side" id="side">
  <h2>Chats <button class="ghost" id="newBtn" type="button">+ New</button></h2>
  <div class="list" id="list"><div class="empty">Loading…</div></div>
</aside>
<div class="gate" id="gate">
  <form id="gateForm">
    <div class="logo" style="margin-bottom:6px">NOOCAP <span>PM</span></div>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button type="submit">Enter</button>
    <div class="err" id="gateErr" style="font-size:13px"></div>
  </form>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  let key = store.get('pmKey') || '';
  let history = [];
  let chatId = store.get('pmChat') || null;
  let busy = false;
  const introHTML = $('intro').outerHTML;
  const headers = () => ({ 'content-type': 'application/json', 'x-pm-key': key });

  // The password box only appears if a PM_PASSWORD is set in Vercel and the server asks for it.
  $('gateForm').onsubmit = (e) => {
    e.preventDefault();
    key = $('pw').value.trim();
    if (!key) return;
    store.set('pmKey', key);
    $('gate').classList.remove('show');
    loadList();
    $('q').focus();
  };
  function needPassword() {
    store.del('pmKey'); key = '';
    $('gateErr').textContent = 'Password needed.';
    $('gate').classList.add('show');
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">link</a>');
  }
  function md(text) {
    const out = []; let list = null;
    for (const raw of String(text).split('\n')) {
      const line = raw.trimEnd();
      const li = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
      if (li) { if (!list) { list = []; } list.push('<li>' + inline(li[1]) + '</li>'); continue; }
      if (list) { out.push('<ul>' + list.join('') + '</ul>'); list = null; }
      if (!line.trim()) continue;
      const h = line.match(/^#{1,4}\s+(.*)$/);
      out.push('<p>' + (h ? '<b>' + inline(h[1]) + '</b>' : inline(line)) + '</p>');
    }
    if (list) out.push('<ul>' + list.join('') + '</ul>');
    return out.join('');
  }

  function changeCard(msg) {
    const box = document.createElement('div');
    box.className = 'change';
    const items = msg.pending.map((p) => p.summary.split('\n').map((l) => '<li>' + esc(l) + '</li>').join('')).join('');
    box.innerHTML = '<div class="lbl">CHANGE IN NOTION</div><ul>' + items + '</ul>' +
      (msg.resolved ? '<div class="state">' + (msg.resolved === 'confirmed' ? 'Confirmed' : 'Cancelled') + '</div>'
        : '<div class="btns"><button type="button" class="ok">Confirm</button><button type="button" class="ghost no">Cancel</button></div>');
    if (!msg.resolved) {
      box.querySelector('.ok').onclick = () => decide(msg, 'confirmed', box);
      box.querySelector('.no').onclick = () => decide(msg, 'cancelled', box);
    }
    return box;
  }

  function add(role, html, meta, msg) {
    $('intro')?.remove();
    const row = document.createElement('div');
    row.className = 'msg ' + role;
    row.innerHTML = '<div class="bubble">' + html + (meta ? '<div class="meta">' + esc(meta) + '</div>' : '') + '</div>';
    if (msg && msg.pending && msg.pending.length) row.querySelector('.bubble').appendChild(changeCard(msg));
    $('log').appendChild(row);
    $('scroll').scrollTop = $('scroll').scrollHeight;
    return row;
  }
  function render() {
    $('log').innerHTML = history.length ? '' : introHTML;
    for (const m of history) add(m.role, m.role === 'user' ? esc(m.content).replace(/\n/g, '<br>') : md(m.content), m.meta, m);
  }

  function ago(iso) {
    const s = (Date.now() - new Date(iso)) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  }
  async function loadList() {
    try {
      const res = await fetch('/api/chats', { headers: headers() });
      if (res.status === 401) return needPassword();
      const data = await res.json();
      const chats = data.chats || [];
      $('list').innerHTML = chats.length ? '' : '<div class="empty">No saved chats yet.</div>';
      for (const c of chats) {
        const el = document.createElement('div');
        el.className = 'item' + (c.id === chatId ? ' active' : '');
        el.innerHTML = '<div class="t"><div>' + esc(c.title) + '</div><small>' + ago(c.updated) + ' · ' + c.count + ' msgs' + (c.channel !== 'Dashboard chat' ? ' · ' + esc(c.channel) : '') + '</small></div><button class="del" title="Delete">×</button>';
        el.onclick = () => openChat(c.id);
        el.querySelector('.del').onclick = async (e) => {
          e.stopPropagation();
          el.remove();
          await fetch('/api/chats?id=' + c.id, { method: 'DELETE', headers: headers() });
          if (c.id === chatId) newChat();
        };
        $('list').appendChild(el);
      }
    } catch (e) {
      $('list').innerHTML = '<div class="empty err">Could not load chats: ' + esc(e.message) + '</div>';
    }
  }
  async function openChat(id) {
    closeSide();
    $('log').innerHTML = '<p class="thinking" style="text-align:center">Loading chat…</p>';
    try {
      const res = await fetch('/api/chats?id=' + id, { headers: headers() });
      if (res.status === 401) return needPassword();
      if (!res.ok) throw new Error('Chat not found');
      const data = await res.json();
      chatId = data.id; store.set('pmChat', chatId);
      history = data.messages || [];
      render();
    } catch (e) {
      newChat();
    }
  }
  function newChat() {
    chatId = null; store.del('pmChat');
    history = [];
    render(); closeSide(); $('q').focus();
  }
  function openSide() { $('side').classList.add('open'); $('shade').classList.add('open'); loadList(); }
  function closeSide() { $('side').classList.remove('open'); $('shade').classList.remove('open'); }

  async function decide(msg, choice, box) {
    if (busy) return;
    busy = true;
    box.querySelector('.btns').innerHTML = '<span class="state">' + (choice === 'confirmed' ? 'Saving to Notion…' : 'Cancelling…') + '</span>';
    msg.resolved = choice;
    try {
      const body = { chatId, channel: 'dashboard', messages: history };
      if (choice === 'confirmed') body.confirm = msg.pending.map((p) => p.token)[0]; else body.cancel = true;
      let replies = [];
      const tokens = choice === 'confirmed' ? msg.pending.map((p) => p.token) : [null];
      for (const t of tokens) {
        const res = await fetch('/api/chat', { method: 'POST', headers: headers(), body: JSON.stringify({ ...body, ...(t ? { confirm: t } : {}) }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
        if (data.chatId) { chatId = data.chatId; store.set('pmChat', chatId); }
        replies.push(data.reply);
        const m = { role: 'assistant', content: data.reply, meta: data.meta, at: new Date().toISOString() };
        history.push(m);
        add('assistant', md(data.reply), data.meta === 'change' ? 'saved to Notion' : '');
      }
      box.querySelector('.btns, .state') && (box.lastElementChild.outerHTML = '<div class="state">' + (choice === 'confirmed' ? 'Confirmed' : 'Cancelled') + '</div>');
    } catch (e) {
      msg.resolved = undefined;
      add('assistant', '<span class="err">Something broke: ' + esc(e.message) + '</span>');
      box.replaceWith(changeCard(msg));
    } finally {
      busy = false;
    }
  }

  async function ask(text) {
    if (busy || !text.trim()) return;
    busy = true; $('send').disabled = true;
    history.push({ role: 'user', content: text, at: new Date().toISOString() });
    add('user', esc(text).replace(/\n/g, '<br>'));
    const wait = add('assistant', '<span class="thinking">Checking Notion…</span>');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: headers(),
        body: JSON.stringify({ messages: history, chatId, channel: 'dashboard' }),
      });
      const data = await res.json().catch(() => ({}));
      wait.remove();
      if (res.status === 401) { history.pop(); needPassword(); return; }
      if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
      const msg = { role: 'assistant', content: data.reply, meta: data.meta, at: new Date().toISOString(), pending: data.pending || [] };
      history.push(msg);
      if (data.chatId) { chatId = data.chatId; store.set('pmChat', chatId); }
      add('assistant', md(data.reply), data.meta, msg);
    } catch (e) {
      wait.remove();
      history.pop();
      add('assistant', '<span class="err">Something broke: ' + esc(e.message) + '</span>');
    } finally {
      busy = false; $('send').disabled = false; $('q').focus();
    }
  }

  $('ask').onsubmit = (e) => { e.preventDefault(); const t = $('q').value; $('q').value = ''; autosize(); ask(t); };
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('ask').requestSubmit(); } });
  function autosize() { const q = $('q'); q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 160) + 'px'; }
  $('q').addEventListener('input', autosize);
  $('clear').onclick = newChat;
  $('newBtn').onclick = newChat;
  $('histBtn').onclick = openSide;
  $('shade').onclick = closeSide;
  if (chatId) openChat(chatId);
</script>
</body>
</html>
