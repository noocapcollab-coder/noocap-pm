<title>NOOCAP Brain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a library — index rail on the left, the page being read on the right, and a map view of how everything connects */
:root {
  --bg: #f4f6f5; --panel: #ffffff; --fg: #17201d; --muted: #5d6b66; --line: #dde4e1;
  --accent: #0f8f72; --accent-soft: #e0f2ec; --chip: #eef2f0; --mark: #fff1b8;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1312; --panel: #151c1a; --fg: #e3ebe7; --muted: #8fa19a; --line: #24302c;
  --accent: #3dd6b0; --accent-soft: #143029; --chip: #1c2623; --mark: #4a4216; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1312; --panel: #151c1a; --fg: #e3ebe7; --muted: #8fa19a; --line: #24302c;
  --accent: #3dd6b0; --accent-soft: #143029; --chip: #1c2623; --mark: #4a4216; color-scheme: dark }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 14px/1.55 var(--body); }
.wrap { height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; gap: 12px; box-sizing: border-box; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { font: 700 24px/1.1 var(--display); margin: 0; letter-spacing: -0.01em; }
.meta { color: var(--muted); font-size: 12.5px; }
.tabs { margin-left: auto; display: flex; gap: 4px; background: var(--chip); padding: 3px; border-radius: 8px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--body); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.tabs button:focus-visible, .item:focus-visible, .chip:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 12px; }
.rail, .reader, .map { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 0; min-width: 0; }
.rail { display: flex; flex-direction: column; }
.search { padding: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.search input { width: 100%; box-sizing: border-box; font: 14px var(--body); padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--fg); }
.filters { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); background: var(--chip); color: var(--fg); font: 500 12px var(--body); padding: 3px 9px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.list { overflow-y: auto; flex: 1; padding: 6px; }
.grp { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 10px 8px 4px; }
.item { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--fg); font: 14px var(--body); padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.item:hover { background: var(--chip); }
.item[aria-current="true"] { background: var(--accent-soft); }
.item small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reader { overflow-y: auto; padding: 22px 26px 40px; }
.reader article { max-width: 72ch; }
.reader h2 { font: 700 26px/1.15 var(--display); margin: 0 0 6px; text-wrap: balance; }
.reader h3 { font: 600 17px/1.3 var(--display); margin: 22px 0 6px; text-wrap: balance; }
.reader h4 { font: 600 14px var(--body); margin: 16px 0 4px; }
.reader p, .reader li { margin: 6px 0; overflow-wrap: anywhere; }
.reader .label { font: 600 11.5px var(--mono); letter-spacing: .04em; color: var(--accent); }
.reader code, .reader pre { font: 12.5px var(--mono); background: var(--chip); border-radius: 4px; }
.reader code { padding: 1px 4px; }
.reader pre { padding: 10px; overflow-x: auto; }
.reader table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
.reader td, .reader th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.reader a.wl { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); cursor: pointer; }
.reader mark { background: var(--mark); color: inherit; border-radius: 2px; }
.where { color: var(--muted); font: 12px var(--mono); margin-bottom: 14px; }
.links { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); }
.links h4 { margin-top: 0; }
.links .chip { margin: 0 6px 6px 0; }
.empty { color: var(--muted); padding: 14px 8px; }
.map { grid-column: 1 / -1; position: relative; }
#graph { position: absolute; inset: 0; }
.legend { position: absolute; left: 10px; top: 10px; max-width: min(300px, 70%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-height: 45%; overflow: auto; }
.legend div { display: flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.note { font-size: 12px; color: var(--muted); }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(200px, 38%) 1fr; }
  .reader { padding: 16px; }
  .tabs { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>NOOCAP Brain</h1>
    <span class="meta" id="meta">Loading…</span>
    <div class="tabs" role="tablist">
      <button id="tab-read" role="tab" aria-selected="true">Read</button>
      <button id="tab-map" role="tab" aria-selected="false">Map</button>
    </div>
  </header>
  <main id="view-read">
    <section class="rail" aria-label="Index">
      <div class="search">
        <input id="q" type="search" placeholder="Search brands, creators, rules, SOPs…" autocomplete="off">
        <div class="filters" id="filters"></div>
      </div>
      <div class="list" id="list"></div>
    </section>
    <section class="reader" id="reader" aria-live="polite"></section>
  </main>
  <main id="view-map" hidden>
    <section class="map"><div id="graph"></div><div class="legend" id="legend"></div></section>
  </main>
</div>

<script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let D = null, current = null, group = 'All', net = null;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '');
const SECTION = /^(WHO|CONTACTS|DEALS|HOW THEY WORK|WATCH OUT|OPEN NOW|AGREED|DONE|WE OWE|THEY OWE|NEXT|HISTORY|STATUS):\s*/;

function inline(t, terms) {
  let h = esc(t)
    .replace(/\[\[([^\]]+)\]\]/g, (_, x) => `<a class="wl" data-t="${esc(x)}">${esc(x)}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  for (const w of terms) if (w.length > 2) h = h.replace(new RegExp(`(?![^<]*>)(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
  return h;
}
function render(md, terms = []) {
  const out = []; let list = null, code = null, table = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } if (table) { out.push('</table>'); table = null; } };
  for (const raw of md.split('\n')) {
    if (raw.startsWith('```')) { if (code !== null) { out.push(`<pre>${esc(code)}</pre>`); code = null; } else { close(); code = ''; } continue; }
    if (code !== null) { code += raw + '\n'; continue; }
    const l = raw.trimEnd();
    if (/^\|.*\|$/.test(l)) { if (/^[|\s:-]+$/.test(l)) continue; if (!table) { close(); out.push('<table>'); table = 1; } out.push('<tr>' + l.slice(1, -1).split('|').map((c) => `<td>${inline(c.trim(), terms)}</td>`).join('') + '</tr>'); continue; }
    if (table) { out.push('</table>'); table = null; }
    let m;
    if (!l.trim()) { close(); continue; }
    if ((m = l.match(/^# (.+)/))) { close(); continue; }
    if ((m = l.match(/^## (.+)/))) { close(); out.push(`<h3>${inline(m[1], terms)}</h3>`); continue; }
    if ((m = l.match(/^#{3,} (.+)/))) { close(); out.push(`<h4>${inline(m[1], terms)}</h4>`); continue; }
    if ((m = l.match(/^\s*[-*•] (\[[ x]\] )?(.+)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[2], terms)}</li>`); continue; }
    if ((m = l.match(/^\s*\d+[.)] (.+)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1], terms)}</li>`); continue; }
    close();
    const s = l.match(SECTION);
    out.push(s ? `<p><span class="label">${s[1]}</span> ${inline(l.slice(s[0].length), terms)}</p>` : `<p>${inline(l, terms)}</p>`);
  }
  close();
  return out.join('\n');
}

function terms() { return $('#q').value.toLowerCase().split(/\s+/).filter((w) => w.length > 1); }
function score(p, t) {
  if (!t.length) return 1;
  const title = p.t.toLowerCase(), body = p.lc;
  let s = 0;
  for (const w of t) { if (title.includes(w)) s += 10; const n = body.split(w).length - 1; if (!n && !title.includes(w)) return 0; s += Math.min(n, 6); }
  return s;
}
function drawList() {
  const t = terms();
  const rows = D.pages.filter((p) => group === 'All' || p.g === group).map((p) => [p, score(p, t)]).filter(([, s]) => s > 0);
  if (t.length) rows.sort((a, b) => b[1] - a[1]);
  const L = $('#list'); L.innerHTML = '';
  if (!rows.length) { L.innerHTML = '<div class="empty">Nothing matches. Try a brand, a creator or a word like “invoice”.</div>'; return; }
  let last = '';
  for (const [p] of rows.slice(0, 400)) {
    if (!t.length && p.g !== last) { L.insertAdjacentHTML('beforeend', `<div class="grp">${esc(p.g)}</div>`); last = p.g; }
    const b = document.createElement('button');
    b.className = 'item'; b.dataset.p = p.p;
    b.setAttribute('aria-current', current === p.p ? 'true' : 'false');
    b.innerHTML = `${esc(p.t)}${t.length ? `<small>${esc(p.g)}</small>` : ''}`;
    b.onclick = () => openPage(p.p);
    L.appendChild(b);
  }
}
function neighbours(p) {
  const i = D.nodes.findIndex((n) => n.f === p.p && norm(n.l) === norm(p.t));
  const idx = i >= 0 ? i : D.nodes.findIndex((n) => n.f === p.p);
  if (idx < 0) return [];
  const seen = new Set(), out = [];
  for (const [a, b, r] of D.links) {
    const o = a === idx ? b : b === idx ? a : -1;
    if (o < 0 || seen.has(o)) continue; seen.add(o);
    out.push({ label: D.nodes[o].l, rel: r });
  }
  return out.slice(0, 40);
}
function openPage(path) {
  const p = D.pages.find((x) => x.p === path); if (!p) return;
  current = path;
  const nb = neighbours(p);
  $('#reader').innerHTML = `<article><h2>${esc(p.t)}</h2><div class="where">${esc(p.g)} · ${esc(p.p)}</div>${render(p.md, terms())}
    ${nb.length ? `<div class="links"><h4>Connected in the map</h4>${nb.map((n) => `<button class="chip" data-t="${esc(n.label)}" title="${esc(n.rel)}">${esc(n.label)}</button>`).join('')}</div>` : ''}</article>`;
  $('#reader').scrollTop = 0;
  document.querySelectorAll('.item').forEach((b) => b.setAttribute('aria-current', b.dataset.p === path ? 'true' : 'false'));
  try { history.replaceState(null, '', '#' + norm(p.t)); } catch {}
}
function openByTitle(t) {
  const k = norm(t);
  const p = D.pages.find((x) => norm(x.t) === k) || D.pages.find((x) => norm(x.t).includes(k) || k.includes(norm(x.t)));
  if (p) { show('read'); openPage(p.p); } else { $('#q').value = t; drawList(); }
}
document.addEventListener('click', (e) => { const a = e.target.closest('[data-t]'); if (a) { e.preventDefault(); openByTitle(a.dataset.t); } });

function show(v) {
  $('#view-read').hidden = v !== 'read'; $('#view-map').hidden = v !== 'map';
  $('#tab-read').setAttribute('aria-selected', v === 'read'); $('#tab-map').setAttribute('aria-selected', v === 'map');
  if (v === 'map') drawMap();
}
$('#tab-read').onclick = () => show('read');
$('#tab-map').onclick = () => show('map');

const PALETTE = ['#0f8f72', '#3b6fd8', '#c2410c', '#9333ea', '#b45309', '#0e7490', '#be185d', '#4d7c0f', '#6d28d9', '#a16207'];
function drawMap() {
  if (net || !window.vis) { if (!window.vis) $('#legend').innerHTML = '<div class="note">The map library could not load. The Read view still works.</div>'; return; }
  const css = getComputedStyle(document.documentElement);
  const fg = css.getPropertyValue('--fg').trim(), line = css.getPropertyValue('--line').trim();
  const deg = new Array(D.nodes.length).fill(0); for (const [a, b] of D.links) { deg[a]++; deg[b]++; }
  const color = (c) => (c >= 0 && c < 10 ? PALETTE[c] : '#8a9893');
  const nodes = new vis.DataSet(D.nodes.map((n, i) => ({ id: i, label: deg[i] > 2 || n.f.startsWith('creators') ? n.l : undefined, title: n.l, value: 1 + deg[i], color: color(n.c), font: { color: fg, size: 13 } })));
  const edges = new vis.DataSet(D.links.map(([a, b, r], i) => ({ id: i, from: a, to: b, title: r, color: { color: line, highlight: color(D.nodes[a].c) } })));
  net = new vis.Network($('#graph'), { nodes, edges }, { nodes: { shape: 'dot', scaling: { min: 4, max: 40 } }, edges: { smooth: false, width: 0.6 }, physics: { solver: 'forceAtlas2Based', stabilization: { iterations: 180 } }, interaction: { hover: true, tooltipDelay: 120 } });
  net.on('doubleClick', (p) => { if (p.nodes.length) { const n = D.nodes[p.nodes[0]]; const pg = D.pages.find((x) => x.p === n.f); if (pg) { show('read'); openPage(pg.p); } } });
  const groups = Object.entries(D.groups).map(([c, l]) => [Number(c), l]).filter(([c]) => c < 10);
  $('#legend').innerHTML = groups.map(([c, l]) => `<div><i style="background:${color(c)}"></i>${esc(l)}</div>`).join('') + '<div class="note" style="margin-top:6px">Double-click a dot to read its page.</div>';
}

fetch('brain-data.json').then((r) => r.json()).then((d) => {
  D = d; for (const p of D.pages) p.lc = p.md.toLowerCase();
  $('#meta').textContent = `${D.pages.length} pages · ${D.nodes.length} concepts · updated ${D.built} · no money in here`;
  const groups = ['All', ...new Set(D.pages.map((p) => p.g))];
  $('#filters').innerHTML = groups.map((g) => `<button class="chip" aria-pressed="${g === 'All'}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
  $('#filters').onclick = (e) => { const b = e.target.closest('[data-g]'); if (!b) return; group = b.dataset.g; document.querySelectorAll('[data-g]').forEach((x) => x.setAttribute('aria-pressed', x === b)); drawList(); };
  $('#q').oninput = () => { drawList(); if (current) openPage(current); };
  drawList();
  const h = (location.hash || '').slice(1);
  const start = (h && D.pages.find((p) => norm(p.t) === h)) || D.pages.find((p) => p.p === 'pages/noocap-systems-sop-library.md') || D.pages.find((p) => p.p === 'rules/pm-memory.md') || D.pages[0];
  openPage(start.p);
}).catch(() => { $('#meta').textContent = 'Could not load the brain data. Reload the page.'; });
</script>
